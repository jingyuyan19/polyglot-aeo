<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Netlify form declarations</title>
  </head>
  <body>
    <form
      name="framer-aeo-mini-audit"
      method="POST"
      action="/audit/thanks/"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="framer-aeo-mini-audit" />
      <input name="request_type" type="text" />
      <input name="source_page" type="text" />
      <input name="agency_name" type="text" />
      <input name="bot-field" />
      <input name="site_url" type="url" />
      <input name="contact_email" type="email" />
      <input name="locales" type="text" />
      <textarea name="concern"></textarea>
      <input name="utm_source" type="text" />
      <input name="utm_medium" type="text" />
      <input name="utm_campaign" type="text" />
      <input name="utm_content" type="text" />
      <input name="utm_term" type="text" />
      <input name="landing_path" type="text" />
      <input name="referrer" type="text" />
    </form>

    <form name="framer-aeo-event" method="POST" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="framer-aeo-event" />
      <input name="event_type" type="text" />
      <input name="cta" type="text" />
      <input name="destination" type="url" />
      <input name="source_path" type="text" />
      <input name="landing_path" type="text" />
      <input name="referrer" type="text" />
      <input name="ts" type="text" />
      <input name="utm_source" type="text" />
      <input name="utm_medium" type="text" />
      <input name="utm_campaign" type="text" />
      <input name="utm_content" type="text" />
      <input name="utm_term" type="text" />
      <input name="reason" type="text" />
      <input name="project_id" type="text" />
      <input name="test_mode" type="text" />
    </form>
  </body>
</html>
